# Windows desktop release. Triggers match build_apk.yml.
# Monorepo: set `defaults.run.working-directory` to the app folder and prefix artifact `path` accordingly.

name: Build Windows

on:
  push:
    branches:
      - main
      - feature/stories
      - feature/word-builder-game
      - leauge
      - release/1.0.10
      - release/1.0.11
      - release/1.0.12
      - release/1.0.16
      - release/1.0.17
      - release/1.0.18
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Zip Windows release
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          $zip = "build/windows/x64/runner/erfan_academy_windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$release/*" -DestinationPath $zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.run_number }}
          path: build/windows/x64/runner/erfan_academy_windows.zip
          retention-days: 30
