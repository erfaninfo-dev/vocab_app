# Windows desktop release. Triggers match build_apk.yml.
# Monorepo: set `defaults.run.working-directory` to the app folder and prefix artifact `path` accordingly.

name: Build Windows

on:
  push:
    branches:
      - main
      - feature/word-builder-game
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.run_number }}
          path: build/windows/x64/runner/Release/
          retention-days: 30
